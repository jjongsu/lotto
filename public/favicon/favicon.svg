<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-labelledby="title desc">
    <title id="title">로또 대시보드 파비콘</title>
    <desc id="desc">그라디언트 배경 위에 3개의 로또 볼과 반짝임을 표현한 아이콘</desc>
    <defs>
        <linearGradient id="bg" x1="8" y1="6" x2="56" y2="58" gradientUnits="userSpaceOnUse">
            <stop offset="0" stop-color="#10253f" />
            <stop offset="0.55" stop-color="#185387" />
            <stop offset="1" stop-color="#22b4b5" />
        </linearGradient>
        <linearGradient id="gloss" x1="16" y1="10" x2="48" y2="34" gradientUnits="userSpaceOnUse">
            <stop offset="0" stop-color="#ffffff" stop-opacity="0.4" />
            <stop offset="1" stop-color="#ffffff" stop-opacity="0" />
        </linearGradient>
        <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
            <feDropShadow dx="0" dy="1.2" stdDeviation="1.4" flood-color="#00142a" flood-opacity="0.45" />
        </filter>
    </defs>

    <rect x="4" y="4" width="56" height="56" rx="16" fill="url(#bg)" />
    <rect x="6" y="6" width="52" height="22" rx="12" fill="url(#gloss)" />
    <rect x="4" y="4" width="56" height="56" rx="16" fill="none" stroke="#d8f4ff" stroke-opacity="0.25" />

    <g filter="url(#shadow)">
        <circle cx="24" cy="36" r="12.1" fill="#f8fbff" />
        <circle cx="24" cy="36" r="10.1" fill="#ffd451" />

        <circle cx="39" cy="25" r="11.1" fill="#f8fbff" />
        <circle cx="39" cy="25" r="9.1" fill="#49c6ff" />

        <circle cx="41" cy="42" r="10.1" fill="#f8fbff" />
        <circle cx="41" cy="42" r="8.1" fill="#ff6c8f" />
    </g>

    <circle cx="20.5" cy="32.2" r="1.9" fill="#ffffff" fill-opacity="0.58" />
    <circle cx="35.9" cy="21.2" r="1.6" fill="#ffffff" fill-opacity="0.56" />
    <circle cx="37.8" cy="38.6" r="1.5" fill="#ffffff" fill-opacity="0.56" />

    <path d="M15.5 18.5l1.1 2.4 2.6.3-2 1.8.6 2.6-2.3-1.4-2.2 1.4.5-2.6-2-1.8 2.7-.3 1-2.4z" fill="#ffffff" />
</svg>
